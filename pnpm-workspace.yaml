ignoreWorkspaceRootCheck: true
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade

# Legacy transitives whose line predates npm provenance, so the trust policy
# reads them as a downgrade from their provenance-signed newer releases.
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'

strictPeerDependencies: false
shellEmulator: true

packages:
  - '*/src'

allowBuilds:
  esbuild: true
  playwright-chromium: true
  pnpm: true

catalog:
  '@antfu/eslint-config': ^9.0.0
  '@iconify/json': ^2.2.509
  '@slidev/cli': ^53.0.0
  '@slidev/client': ^53.0.0
  '@slidev/theme-default': ^0.25.0
  '@slidev/theme-seriph': 0.25.0
  '@slidev/types': ^53.0.0
  '@types/node': ^24.0.0
  '@types/prompts': ^2.4.9
  '@types/seedrandom': ^3.0.8
  axios: ^1.7.4
  eslint: ^10.0.0
  eslint-plugin-format: ^2.0.0
  esno: ^4.7.0
  execa: ^10.2.0
  playwright-chromium: ^1.45.1
  pnpm: ^12.0.0
  prettier-plugin-slidev: ^1.0.5
  prompts: ^2.4.2
  rimraf: ^6.0.1
  seedrandom: ^3.0.5
  tsx: ^4.19.0
  typescript: ^6.0.0
  vue: ^3.5.0
  vue-tsc: ^3.0.0
