name: Pages
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Check README talks table
        run: pnpm run readme:check
      - name: Build documentation
        run: pnpm run build
      - name: Install Chromium system dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm --filter ./01-branded-types/src exec playwright install-deps chromium
      - name: Export PDFs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm run export --all
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # force_orphan rewrites gh-pages, so concurrent deploys race on the push.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
